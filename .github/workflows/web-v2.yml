name: web-v2

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: web-v2-${{ github.ref }}
  # Keep main's history complete; only supersede pull request builds.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check web-v2
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: web-v2

      - name: Install wasm-pack
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build browser engine for web-v2
        run: bun run build:wasm

      - name: Lint and format
        run: bun run check

      - name: Type check
        run: bun run check:types

      - name: Build
        run: bun run build

      - name: Unit tests
        run: bun run test

      - name: Install Playwright Chromium
        run: bun run --cwd tooling/web-visual install:browser:ci

      - name: Browser tests
        run: bun run test:visual:only

      - name: Upload browser test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-v2-visual-results
          path: tooling/web-visual/test-results
          if-no-files-found: ignore

      - name: Upload web-v2 build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: web-v2-dist
          path: web-v2/dist
          include-hidden-files: true
          if-no-files-found: error

  deploy:
    name: Deploy web-v2
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # One deploy at a time, in push order; never cancel one midway.
    concurrency:
      group: web-v2-deploy
      cancel-in-progress: false

    steps:
      - uses: actions/checkout@v6

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Download web-v2 build
        uses: actions/download-artifact@v4
        with:
          name: web-v2-dist
          path: web-v2/dist

      - name: Deploy to Cloudflare Workers
        working-directory: web-v2
        run: bun run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
