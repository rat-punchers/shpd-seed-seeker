<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Find and analyze Shattered Pixel Dungeon seeds in your browser."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/png" href="/favicon.png" />
    <title>Seed Seeker</title>
    <!-- The boot screen styles itself: the app stylesheet loads with the
         entry module (in dev, only once the whole module graph has). It
         fades in late so a fast load does not flash it. -->
    <style>
      .boot-loading {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        background: var(--background, oklch(0.915 0.009 100));
        color: var(--muted-foreground, oklch(0.47 0.012 100));
        font: 0.875rem / 1.25rem var(--font-sans, system-ui, sans-serif);
        animation: boot-loading-in 150ms ease-out 300ms both;
      }
      .dark .boot-loading {
        background: var(--background, oklch(0.19 0.006 95));
        color: var(--muted-foreground, oklch(0.71 0.012 100));
      }
      .boot-loading svg {
        width: 1.5rem;
        height: 1.5rem;
        flex: none;
        animation: boot-loading-spin 1s linear infinite;
      }
      .boot-loading p {
        margin: 0;
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-loading svg {
          animation: none;
        }
      }
      @keyframes boot-loading-in {
        from {
          opacity: 0;
        }
      }
      @keyframes boot-loading-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-loading">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 256 256"
          fill="currentColor"
          aria-hidden="true"
        >
          <path
            d="M136,32V64a8,8,0,0,1-16,0V32a8,8,0,0,1,16,0Zm88,88H192a8,8,0,0,0,0,16h32a8,8,0,0,0,0-16Zm-45.09,47.6a8,8,0,0,0-11.31,11.31l22.62,22.63a8,8,0,0,0,11.32-11.32ZM128,184a8,8,0,0,0-8,8v32a8,8,0,0,0,16,0V192A8,8,0,0,0,128,184ZM77.09,167.6,54.46,190.22a8,8,0,0,0,11.32,11.32L88.4,178.91A8,8,0,0,0,77.09,167.6ZM72,128a8,8,0,0,0-8-8H32a8,8,0,0,0,0,16H64A8,8,0,0,0,72,128ZM65.78,54.46A8,8,0,0,0,54.46,65.78L77.09,88.4A8,8,0,0,0,88.4,77.09Z"
          />
        </svg>
        <p role="status">Loading Seed Seeker…</p>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
